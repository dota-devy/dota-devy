<svg width="900" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <!-- Neon glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for accents -->
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00ff8822" stroke-width="0.3"/>
    </pattern>

    <!-- Animated circuit path -->
    <linearGradient id="circuit-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0">
        <animate attributeName="offset" values="-0.5;1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="15%" style="stop-color:#00ff88;stop-opacity:1">
        <animate attributeName="offset" values="-0.35;1.15" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" style="stop-color:#00ff88;stop-opacity:0">
        <animate attributeName="offset" values="-0.2;1.3" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="circuit-pulse-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0">
        <animate attributeName="offset" values="-0.5;1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="15%" style="stop-color:#ff6b6b;stop-opacity:1">
        <animate attributeName="offset" values="-0.35;1.15" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" style="stop-color:#ff6b6b;stop-opacity:0">
        <animate attributeName="offset" values="-0.2;1.3" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#b088ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)" rx="12"/>

  <!-- Grid overlay -->
  <rect width="900" height="300" fill="url(#grid)" rx="12" opacity="0.6"/>

  <!-- Scanline overlay -->
  <rect width="900" height="300" fill="url(#scanlines)" rx="12"/>

  <!-- Circuit traces - left side -->
  <g opacity="0.7">
    <!-- Horizontal traces -->
    <line x1="0" y1="80" x2="200" y2="80" stroke="url(#circuit-pulse)" stroke-width="1.5"/>
    <line x1="0" y1="140" x2="150" y2="140" stroke="#1a2332" stroke-width="1"/>
    <line x1="0" y1="140" x2="150" y2="140" stroke="url(#circuit-pulse)" stroke-width="1.5"/>
    <line x1="0" y1="220" x2="180" y2="220" stroke="url(#circuit-pulse)" stroke-width="1.5"/>

    <!-- Vertical traces -->
    <line x1="200" y1="80" x2="200" y2="130" stroke="url(#circuit-pulse-2)" stroke-width="1.5"/>
    <line x1="150" y1="140" x2="150" y2="200" stroke="url(#circuit-pulse-2)" stroke-width="1.5"/>

    <!-- Circuit nodes -->
    <circle cx="200" cy="80" r="3" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="140" r="3" fill="#ff6b6b" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="130" r="2.5" fill="#00d4ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="220" r="3" fill="#b088ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Circuit traces - right side -->
  <g opacity="0.7">
    <line x1="900" y1="60" x2="720" y2="60" stroke="url(#circuit-pulse)" stroke-width="1.5"/>
    <line x1="900" y1="160" x2="750" y2="160" stroke="url(#circuit-pulse)" stroke-width="1.5"/>
    <line x1="900" y1="240" x2="700" y2="240" stroke="url(#circuit-pulse)" stroke-width="1.5"/>

    <line x1="720" y1="60" x2="720" y2="120" stroke="url(#circuit-pulse-2)" stroke-width="1.5"/>
    <line x1="750" y1="160" x2="750" y2="230" stroke="url(#circuit-pulse-2)" stroke-width="1.5"/>

    <circle cx="720" cy="60" r="3" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="160" r="3" fill="#ff6b6b" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="120" r="2.5" fill="#00d4ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="240" r="3" fill="#b088ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative hex elements -->
  <g transform="translate(80, 150)" opacity="0.15">
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="none" stroke="#00ff88" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g transform="translate(820, 100)" opacity="0.15">
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="none" stroke="#00d4ff" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="25s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Main title -->
  <text x="450" y="115" text-anchor="middle" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="url(#title-gradient)" filter="url(#glow)">
    dota-devy
  </text>

  <!-- Subtitle with typing effect -->
  <text x="450" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#8b949e">
    <tspan fill="#00ff88">&gt;</tspan> gamer // hacker // builder // explorer
  </text>

  <!-- Blinking cursor -->
  <rect x="665" y="142" width="9" height="16" fill="#00ff88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="450" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" opacity="0.8">
    making robots do my bidding since boot sector 0x00
  </text>

  <!-- Bottom decorative line -->
  <line x1="250" y1="230" x2="650" y2="230" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="235" x2="600" y2="235" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-width="1.5" opacity="0.4">
    <!-- Top-left -->
    <line x1="20" y1="30" x2="20" y2="15"/>
    <line x1="20" y1="15" x2="35" y2="15"/>
    <!-- Top-right -->
    <line x1="880" y1="30" x2="880" y2="15"/>
    <line x1="880" y1="15" x2="865" y2="15"/>
    <!-- Bottom-left -->
    <line x1="20" y1="270" x2="20" y2="285"/>
    <line x1="20" y1="285" x2="35" y2="285"/>
    <!-- Bottom-right -->
    <line x1="880" y1="270" x2="880" y2="285"/>
    <line x1="880" y1="285" x2="865" y2="285"/>
  </g>

  <!-- Status indicators bottom-left -->
  <g transform="translate(30, 260)" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" opacity="0.5">
    <circle cx="0" cy="-3" r="3" fill="#00ff88">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="0">SYS.ONLINE</text>
  </g>

  <!-- Version indicator bottom-right -->
  <text x="870" y="260" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#8b949e" opacity="0.4">
    v2.0.26
  </text>
</svg>
