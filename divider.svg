<svg width="900" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00ff88;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#b088ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#b088ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="line-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0">
        <animate attributeName="offset" values="-0.3;1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="5%" style="stop-color:#ffffff;stop-opacity:0.6">
        <animate attributeName="offset" values="-0.25;1.05" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="10%" style="stop-color:#ffffff;stop-opacity:0">
        <animate attributeName="offset" values="-0.2;1.1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Main gradient line -->
  <line x1="50" y1="20" x2="850" y2="20" stroke="url(#line-grad)" stroke-width="1.5" filter="url(#line-glow)"/>

  <!-- Animated sweep -->
  <line x1="50" y1="20" x2="850" y2="20" stroke="url(#sweep)" stroke-width="2"/>

  <!-- Center diamond -->
  <g transform="translate(450, 20)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#00d4ff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Side dots -->
  <circle cx="200" cy="20" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="700" cy="20" r="2" fill="#b088ff" opacity="0.5"/>
</svg>
